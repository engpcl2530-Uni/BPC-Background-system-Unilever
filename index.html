<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPC Engineering Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        :root {
            --primary-bg: #e2e8f0; 
            --panel-bg: #ffffff;
            --text-dark: #0f172a;
            --text-gray: #475569;
            --border-color: #cbd5e1;
            --accent-blue: #1e3a8a; 
            --accent-yellow: #fbbf24; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 3px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #0f172a 100%);
            padding: 50px 30px; /* เพิ่ม Padding ให้รับกับโลโก้ที่ใหญ่ขึ้น */
            text-align: center;
            color: white;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, var(--accent-yellow));
        }

        /* ปรับขนาดโลโก้ให้ใหญ่ขึ้นและอยู่ในวงกลมพรีเมียม */
        .logo-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 130px; /* ขยายขนาดใหญ่ขึ้น */
            height: 130px; /* ขยายขนาดใหญ่ขึ้น */
            background: #ffffff;
            border-radius: 50%; /* วงกลมสมบูรณ์ */
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            padding: 12px;
            border: 4px solid rgba(251, 191, 36, 0.3); /* เพิ่มเส้นขอบเหลืองจางๆ */
            overflow: hidden;
        }

        .company-logo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ให้รูปอยู่ครบในกรอบ ไม่โดนตัด */
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p.subtitle {
            color: #cbd5e1;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .content {
            padding: 45px 35px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 25px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background-color: transparent;
            transition: all 0.3s ease;
            border-radius: 10px 0 0 10px;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }

        .menu-card.card-1:hover::before { background-color: #0284c7; }
        .menu-card.card-2:hover::before { background-color: var(--accent-blue); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .icon-wrapper {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card-1 .icon-wrapper { 
            background-color: #e0f2fe; 
            color: #0284c7; 
            border: 1px solid #bae6fd;
        }
        .card-1:hover .icon-wrapper { background-color: #0284c7; color: #ffffff; }

        .card-2 .icon-wrapper { 
            background-color: #1e3a8a; 
            color: var(--accent-yellow); 
            border: 1px solid #1e40af;
        }
        .card-2:hover .icon-wrapper { 
            background-color: #172554; 
            transform: scale(1.05);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: flex;
            align-items: center;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-gray);
            line-height: 1.5;
            flex-grow: 1;
        }

        .action-text {
            margin-top: 18px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-2 .action-text { color: var(--accent-blue); }

        .menu-card:hover .action-text i {
            transform: translateX(5px);
            transition: transform 0.3s ease;
        }

        @media (max-width: 600px) {
            .header { padding: 40px 20px; }
            .content { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
            .logo-container { width: 110px; height: 110px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="https://lh3.googleusercontent.com/d/1HRIPmqSbC5mCoe7lX-y5gZF-1IpHk-vC" 
                     alt="BPC Logo" 
                     class="company-logo" 
                     onerror="this.src='https://drive.google.com/thumbnail?id=1HRIPmqSbC5mCoe7lX-y5gZF-1IpHk-vC&sz=w500'">
            </div>
            
            <h1>BPC Engineering Hub</h1>
            <p class="subtitle">Centralized Engineering Application Portal</p>
        </div>
        
        <div class="content">
            <div class="menu-grid">
                <a href="https://script.google.com/macros/s/AKfycbzbeXFbqCNYA6F0GRiLXfK9WMizCXBZdrrdUQae10p_U-h018VQc6UbnhWS2yDBvHl-Aw/exec?page=1&search" target="_blank" class="menu-card card-1">
                    <div class="card-header">
                        <div class="icon-wrapper">
                            <i class="fa-solid fa-boxes-packing"></i>
                        </div>
                        <div class="status-badge">
                            <i class="fa-solid fa-circle" style="font-size: 0.4rem; margin-right:5px;"></i> Online
                        </div>
                    </div>
                    <div class="card-title">BPC Store</div>
                    <div class="card-desc">ระบบเบิก-จ่ายอะไหล่และจัดการสินค้าคงคลัง (Spare Parts Management)</div>
                    <div class="action-text">เข้าสู่ระบบ <i class="fa-solid fa-arrow-right"></i></div>
                </a>

                <a href="https://engpcl2530-uni.github.io/BPC-CMMS-System/" target="_blank" class="menu-card card-2">
                    <div class="card-header">
                        <div class="icon-wrapper">
                            <i class="fa-solid fa-microchip"></i>
                        </div>
                        <div class="status-badge">
                            <i class="fa-solid fa-circle" style="font-size: 0.4rem; margin-right:5px;"></i> Online
                        </div>
                    </div>
                    <div class="card-title">CMMS Master</div>
                    <div class="card-desc">ระบบจัดการ Machine Ledger และบำรุงรักษาเครื่องจักรภายในโรงงาน</div>
                    <div class="action-text">เข้าสู่ระบบ <i class="fa-solid fa-arrow-right"></i></div>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
